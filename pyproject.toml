[project]
name = "wizterm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scoob", email = "skylersatiacum@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "pyqt6>=6.12.1",
    "pyte>=0.8.2",
    "pywinpty>=3.1.2",
]

[project.scripts]
wizterm = "wizterm:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
